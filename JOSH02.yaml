  - name: "JOSH INTERNET-KST"
    type: socks5
    server: 103.115.158.1
    port: 10888
    username: ras007
    password: "121"

  - name: "JOSH INTERNET-RS"
    type: socks5
    server: 103.81.104.149
    port: 10888
    username: ras007
    password: "121"

  - name: "JOSH-BBTS-1"
    type: http
    server: 202.5.60.205
    port: 21528

  - name: "JOSH-BBTS-2"
    type: http
    server: 202.5.60.204
    port: 21528

  - name: "JOSH-BBTS-3"
    type: http
    server: 202.5.60.211
    port: 21528

  - name: "JOSH-BBTS-4"
    type: http
    server: 202.5.60.225
    port: 21528

  - name: "JOSH-BDCOM-5"
    type: http
    server: 103.16.72.174
    port: 21528

  - name: "JOSH-Nextonline"
    type: socks5
    server: 43.225.148.173
    port: 6113
    username: flcash
    password: flcash



proxy-groups:
  - name: "SELECT"
    type: select
    proxies:
      - AUTO
      - FAILOVER
      - LOAD-BALANCE
      - JOSH INTERNET-Main
      - JOSH INTERNET-KST
      - JOSH INTERNET-RS
      - JOSH-BBTS-1
      - JOSH-BBTS-2
      - JOSH-BBTS-3
      - JOSH-BBTS-4
      - JOSH-BDCOM-5
      - JOSH-Nextonline
      - JOSH-Orbit
      - DIRECT

  - name: "AUTO"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - JOSH INTERNET-Main
      - JOSH INTERNET-KST
      - JOSH INTERNET-RS
      - JOSH-BBTS-1
      - JOSH-BBTS-2
      - JOSH-BBTS-3
      - JOSH-BBTS-4
      - JOSH-BDCOM-5
      - JOSH-Nextonline
      - JOSH-Orbit

  - name: "FAILOVER"
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - JOSH INTERNET-Main
      - JOSH INTERNET-KST
      - JOSH INTERNET-RS
      - JOSH-BBTS-1
      - JOSH-BBTS-2
      - JOSH-BBTS-3
      - JOSH-BBTS-4
      - JOSH-BDCOM-5
      - JOSH-Nextonline
      - JOSH-Orbit

  - name: "LOAD-BALANCE"
    type: load-balance
    strategy: round-robin
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - JOSH INTERNET-Main
      - JOSH INTERNET-KST
      - JOSH INTERNET-RS
      - JOSH-BBTS-1
      - JOSH-BBTS-2
      - JOSH-BBTS-3
      - JOSH-BBTS-4
      - JOSH-BDCOM-5
      - JOSH-Nextonline
      - JOSH-Orbit

rules:
  - MATCH,SELECT
