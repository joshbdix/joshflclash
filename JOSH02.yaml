proxy-groups:

  # Manual Select
  - name: "SELECT"
    type: select
    proxies:
      - JOSH INTERNET-Main
      - JOSH INTERNET-KST
      - JOSH INTERNET-RS  
      - AUTO
      - FAILOVER
      - LOAD-BALANCE
      - JOSH-BBTS-20M
      - JOSH-BBTS-20M-2
      - JOSH-BBTS-50M
      - JOSH-BBTS-120M
      - JOSH-BDCOM-50M
      - JOSH-Nextonline-100M
      - JOSH-FTP
      - JOSH-EURO-200M
  
      - DIRECT

  # Fastest Proxy
  - name: "AUTO"
    type: url-test
    url: http://www.gstatic.com/generate_204
    interval: 300
    tolerance: 50
    proxies:
      - JOSH INTERNET-Main
      - JOSH INTERNET-KST
      - JOSH INTERNET-RS  
      - JOSH-BBTS-20M
      - JOSH-BBTS-20M-2
      - JOSH-BBTS-50M
      - JOSH-BBTS-120M
      - JOSH-BDCOM-50M
      - JOSH-Nextonline-100M
      - JOSH-FTP
      - JOSH-EURO-200M
      - JOSH-Circle-LiVETV

  # Auto Failover
  - name: "FAILOVER"
    type: fallback
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - JOSH INTERNET-Main
      - JOSH INTERNET-KST
      - JOSH INTERNET-RS 
      - JOSH-BBTS-20M
      - JOSH-BBTS-20M-2
      - JOSH-BBTS-50M
      - JOSH-BBTS-120M
      - JOSH-BDCOM-50M
      - JOSH-Nextonline-100M
      - JOSH-FTP
      - JOSH-EURO-200M

      
  # Load Balance
  - name: "LOAD-BALANCE"
    type: load-balance
    strategy: round-robin
    url: http://www.gstatic.com/generate_204
    interval: 300
    proxies:
      - JOSH INTERNET-Main
      - JOSH INTERNET-KST
      - JOSH INTERNET-RS  
      - JOSH-BBTS-20M
      - JOSH-BBTS-20M-2
      - JOSH-BBTS-50M
      - JOSH-BBTS-120M
      - JOSH-BDCOM-50M
      - JOSH-Nextonline-100M
      - JOSH-FTP
      - JOSH-EURO-200M

      
rules:
  - MATCH,SELECT
