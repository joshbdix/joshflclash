  - name: "JOSH INTERNET-KST"
    type: socks5
    server: 103.115.158.1
    port: 10888
    username: ras007
    password: 121

  - name: "JOSH INTERNET-RS"
    type: socks5
    server: 103.81.104.149
    port: 10888
    username: test
    password: test123

  - name: "JOSH-BBTS-20M"
    type: http
    server: 202.5.60.205
    port: 21528

  - name: "JOSH-BBTS-20M-2"
    type: http
    server: 202.5.60.204
    port: 21528

  - name: "JOSH-BBTS-50M"
    type: http
    server: 202.5.60.211
    port: 21528

  - name: "JOSH-BBTS-120M"
    type: http
    server: 202.5.60.225
    port: 21528

  - name: "JOSH-BDCOM-50M"
    type: http
    server: 103.16.72.174
    port: 21528

  - name: "JOSH-Nextonline-100M"
    type: socks5
    server: 43.225.148.173
    port: 6113
    username: flcash
    password: flcash

  - name: "JOSH-FTP"
    type: socks5
    server: 202.40.190.134
